name: CI
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - gc ${{ matrix.gc }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'pre' # the latest prerelease (1.14 has no release yet; change to '1.14' once it does)
        group:
          - Core
        # the collector as it is by default, and in stress mode (a collection every 3 allocations,
        # freed memory overwritten), which finds objects that the collector fails to see
        gc:
          - 'true'
          - '3'
        # Linux and macOS, on x86 and ARM (the compiled code is native, so the platforms differ)
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v1
      # TODO: until the `llvm_postprocess` option of `compile_executable` etc. is in a release of
      # StaticCompiler.jl, use the version that has it, and remove this step once it is released:
      # - name: Use the development version of StaticCompiler.jl
      #   shell: julia --project=. {0}
      #   run: |
      #     using Pkg
      #     Pkg.add(PackageSpec(url = "https://github.com/OWNER/StaticCompiler.jl", rev = "BRANCH"))
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: ${{ matrix.group }}
          STATIC_COMPILER_OVERRIDES_GC: ${{ matrix.gc }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v2
        with:
          files: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # to deploy to the gh-pages branch with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'pre' 
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using StaticCompilerOverrides
            DocMeta.setdocmeta!(StaticCompilerOverrides, :DocTestSetup, :(using StaticCompilerOverrides); recursive=true)
            doctest(StaticCompilerOverrides)'
